<style>
/* Layout: one study column (max 760px) — range bar, tab strip, then the active drill. Cards only for the thing being studied. */
:root{
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#1B2230; --muted:#5D6879; --line:#D9DEE6;
  --accent:#2E4A8B; --accent-ink:#FFFFFF; --accent-soft:#E4EAF6;
  --seal:#C0402C; --ok:#2C7A57; --ok-soft:#E1F1E8; --bad:#B2372B; --bad-soft:#F8E4E1; --warn:#9A6A12;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Songti SC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F131A; --card:#171C26; --ink:#E6EAF1; --muted:#98A3B5; --line:#2A3241;
  --accent:#8EA7E6; --accent-ink:#0F131A; --accent-soft:#1D2740;
  --seal:#E2664F; --ok:#5DC08F; --ok-soft:#173327; --bad:#EE6E60; --bad-soft:#3A1D1A; --warn:#E0B35A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F131A; --card:#171C26; --ink:#E6EAF1; --muted:#98A3B5; --line:#2A3241;
  --accent:#8EA7E6; --accent-ink:#0F131A; --accent-soft:#1D2740;
  --seal:#E2664F; --ok:#5DC08F; --ok-soft:#173327; --bad:#EE6E60; --bad-soft:#3A1D1A; --warn:#E0B35A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:1.9rem;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sub{color:var(--muted);font-size:.85rem;margin:2px 0 0}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-size:1.25rem;line-height:1.2}
.stat span{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.range{display:flex;flex-direction:column;gap:8px}
.label{font-size:.75rem;color:var(--muted);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.ghost{background:transparent}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:2px;overflow-x:auto}
.tab{background:none;border:none;padding:10px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:none;padding:6px 10px;font-size:.85rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:12px 0}
.big{font-family:var(--display);font-size:2.6rem;line-height:1.25;font-weight:700}
.kana{font-size:1.15rem;color:var(--muted)}
.mean{font-size:1.2rem}
.pos{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);vertical-align:middle}
.star{color:var(--seal);font-size:.8rem;font-weight:700}
.ex{border-left:3px solid var(--accent-soft);padding-left:10px;margin:0;display:flex;flex-direction:column}
.ex .jp{font-size:1rem}.ex .zh{font-size:.85rem;color:var(--muted)}
.detail{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:.85rem;border-radius:8px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{display:flex;flex-direction:column;align-items:center;gap:0}
.grade small{font-size:.72rem;color:var(--muted);font-weight:400}
.g-bad{border-color:var(--bad)!important;color:var(--bad)}
.g-mid{border-color:var(--warn)!important;color:var(--warn)}
.g-ok{border-color:var(--ok)!important;color:var(--ok)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;text-align:left;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .o1{font-size:1.05rem;font-weight:500}.opt .o2{font-size:.8rem;color:var(--muted)}
.sent{font-size:1.25rem;line-height:1.7}
.sent .blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--accent);color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted)}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.note b{color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.groups{display:flex;flex-direction:column;gap:12px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gtitle{font-weight:700;font-size:1.05rem}
.kind{font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.gnote{font-size:.9rem;color:var(--muted);margin:0}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cmp>div{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cmp .w{font-family:var(--display);font-size:1.3rem;font-weight:700}
.cmp .r{font-size:.85rem;color:var(--muted)}
.cmp .m{font-size:.9rem}
.cmp .e{font-size:.82rem;color:var(--muted);margin-top:4px}
.list{width:100%;border-collapse:collapse;font-size:.92rem}
.list td,.list th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.list th{font-size:.75rem;color:var(--muted);font-weight:500;letter-spacing:.05em}
.list .w{font-weight:700}
.tbl{overflow-x:auto}
.lv{display:inline-flex;gap:2px}.lv i{width:6px;height:10px;border-radius:2px;background:var(--line)}.lv i.on{background:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:32px 10px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.speak{border:none;background:none;color:var(--accent);padding:4px;display:inline-flex;vertical-align:middle}
.speak svg{width:20px;height:20px}
.foot{font-size:.78rem;color:var(--muted);text-align:center}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.score{font-family:var(--display);font-size:3rem;font-weight:700;line-height:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0}
[hidden]{display:none!important}
code{font-size:.85em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.88rem}
.acct-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.acct-act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.acct-email{font-weight:700;overflow-wrap:anywhere}
.acct-status{color:var(--muted);font-size:.82rem}
.acct-status.ok{color:var(--ok)}.acct-status.err{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.dot.on{background:var(--ok)}
.acct-form{display:flex;flex-direction:column;gap:10px}
.acct-fields{display:flex;flex-wrap:wrap;gap:8px}
.acct-fields input{flex:1 1 200px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.acct-msg{font-size:.85rem;color:var(--muted)}.acct-msg.bad{color:var(--bad)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>N4 单词自测</h1>
      <p class="sub">《50天逐级突破 N5·N4·N3 单词天天背》N4 阶段 · 第 13–24 天 · 共 <span id="total"></span> 词</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDue">0</b><span>今日待复习</span></div>
      <div class="stat"><b id="sKnown">0</b><span>已记牢</span></div>
      <div class="stat"><b id="sWrong">0</b><span>错题</span></div>
    </div>
  </header>

  <section class="acct" id="acct" aria-label="账号与同步"></section>

  <section class="range" aria-label="学习范围">
    <div class="label">选择天数</div>
    <div class="chips" id="days"></div>
    <div class="row">
      <button class="chip ghost" id="allDays" type="button">全选</button>
      <button class="chip ghost" id="noDays" type="button">只选第 13 天</button>
      <button class="chip" id="starOnly" type="button" aria-pressed="false">只练 ★ 重点词</button>
      <span class="hint" id="poolInfo"></span>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="flash" aria-selected="true">闪卡</button>
    <button class="tab" role="tab" data-tab="quiz" aria-selected="false">选择题</button>
    <button class="tab" role="tab" data-tab="groups" aria-selected="false">易混词</button>
    <button class="tab" role="tab" data-tab="wrong" aria-selected="false">错题本</button>
    <button class="tab" role="tab" data-tab="list" aria-selected="false">词表</button>
  </nav>

  <main id="view"></main>
  <p class="foot">登录后进度自动同步到云端，未登录时只保存在本机。复习间隔：不会→当天再来，模糊→明天，记住了→2、4、7、15、30 天后。</p>
</div>

const W = DATA.w, GROUPS = DATA.g;
const INT = [0,1,2,4,7,15,30];
const KEY = 'n4vocab.v1';
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / 864e5);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isKanji = ch => /[一-鿿々]/.test(ch);

// word → groups
const wGroups = W.map(() => []);
GROUPS.forEach((g, gi) => g.w.forEach(id => wGroups[id].push(gi)));

let S = { days: [13], star: false, tab: 'flash', dir: 'k2m', qtype: 'mix', qn: 10 };
let P = {};
function load() { try { const o = JSON.parse(localStorage.getItem(KEY) || '{}'); if (o.P) P = o.P; if (o.S) S = Object.assign(S, o.S); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ P, S })); } catch (e) {} }

const label = w => w.j ? w.j.split('・')[0] : w.k;
const pool = () => W.map((w, i) => i).filter(i => S.days.includes(W[i].d) && (!S.star || W[i].s));
const isDue = i => P[i] && P[i].due <= today();

function grade(i, g) { // g: 0 bad, 1 fuzzy, 2 ok
  const p = P[i] || { b: 0, due: today(), w: 0, r: 0 };
  if (g === 0) { p.b = 0; p.due = today(); p.w = (p.w || 0) + 1; }
  else if (g === 1) { p.b = Math.max(1, Math.min(p.b, 2)); p.due = today() + 1; }
  else { p.b = Math.min(p.b + 1, INT.length - 1); p.due = today() + INT[p.b]; p.r = (p.r || 0) + 1; }
  p.t = Date.now(); P[i] = p; save(); stats(); schedulePush();
}
function quizMark(i, ok) {
  const p = P[i] || { b: 0, due: today(), w: 0, r: 0 };
  if (ok) p.r = (p.r || 0) + 1; else { p.w = (p.w || 0) + 1; p.b = 0; p.due = today(); }
  p.t = Date.now(); P[i] = p; save(); stats(); schedulePush();
}

function stats() {
  $('#total').textContent = W.length;
  const ids = Object.keys(P);
  $('#sDue').textContent = ids.filter(i => P[i].due <= today()).length;
  $('#sKnown').textContent = ids.filter(i => P[i].b >= 3).length;
  $('#sWrong').textContent = ids.filter(i => P[i].w > 0).length;
  const pl = pool();
  $('#poolInfo').textContent = `当前范围 ${pl.length} 词`;
}

// ---------- speech ----------
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function speak(t) { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
const spkBtn = t => `<button class="speak" type="button" data-say="${esc(t)}" aria-label="朗读">${SPK}</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) speak(b.dataset.say); });

// ---------- shared rendering ----------
function wordDetail(i, opts = {}) {
  const w = W[i];
  const ex = w.e.map(([jp, zh]) => `<p class="ex"><span class="jp">${esc(jp)} ${spkBtn(jp)}</span><span class="zh">${esc(zh)}</span></p>`).join('');
  const gs = wGroups[i].map(gi => `<button class="chip" type="button" data-group="${gi}">${esc(GROUPS[gi].t)}</button>`).join('');
  return `<div class="detail">
    <div><span class="big" style="font-size:1.8rem">${esc(w.j || w.k)}</span> ${w.j ? `<span class="kana">${esc(w.k)}</span>` : ''} ${spkBtn(w.k)}</div>
    <div><span class="pos">${esc(w.p || '—')}</span> ${w.s ? '<span class="star">★重点</span>' : ''} <span class="mean">${esc(w.m)}</span></div>
    ${ex}
    ${gs ? `<div class="row"><span class="label">易混</span>${gs}</div>` : ''}
  </div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-group]'); if (b) { S.tab = 'groups'; groupFocus = +b.dataset.group; render(); } });

// ---------- flashcards ----------
let FQ = null, FI = 0, shown = false;
function buildFlashQueue() {

let Q = null;
function maskSentence(s, w) {

    if (!f) continue;
    const start = isKanji(f[0]) ? s.indexOf(f[0]) : s.indexOf(f.slice(0, Math.min(2, f.length)));
    if (start < 0) continue;
    let L = 0; while (L < f.length && s[start + L] === f[L]) L++;
    if (L >= 2 || (L === 1 && isKanji(f[0]))) return s.slice(0, start) + '<span class="blank">　？　</span>' + s.slice(start + L);
  }

}
function distractors(i, n, keyFn) {

  wGroups[i].forEach(gi => shuffle(GROUPS[gi].w).forEach(push));
  shuffle(W.map((_, j) => j).filter(j => W[j].p === w.p && W[j].k[0] === w.k[0])).forEach(push);
  shuffle(W.map((_, j) => j).filter(j => W[j].p === w.p && Math.abs(W[j].k.length - w.k.length) <= 1)).forEach(push);
  shuffle(W.map((_, j) => j)).forEach(push);

}
const fmtWord = j => `<span class="o1">${esc(W[j].j || W[j].k)}</span>${W[j].j ? `<br><span class="o2">${esc(W[j].k)}</span>` : ''}`;

const fmtKana = j => `<span class="o1">${esc(W[j].k)}</span>`;

}
const siteUrl = () => location.origin + location.pathname;
function cnErr(e) {
  const m = String((e && e.message) || e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '连不上同步服务器，请检查网络。进度已先保存在本机，联网后会自动补传。';
  if (/Invalid login credentials/i.test(m)) return '邮箱或密码不对。';
  if (/Email not confirmed/i.test(m)) return '邮箱还没确认，请先点确认邮件里的链接。';
  if (/already registered|already been registered/i.test(m)) return '这个邮箱已经注册过了，请直接登录。';
  if (/Password should be at least/i.test(m)) return '密码至少 6 位。';
  if (/rate limit|too many/i.test(m)) return '操作太频繁，请过一会儿再试。';
  if (/valid email|invalid format/i.test(m)) return '邮箱格式不对。';
  if (/relation .* does not exist|Could not find the table/i.test(m)) return '数据库里还没有 progress 表，请按说明在 Supabase 里运行 setup.sql。';
  if (/JWT|expired/i.test(m)) return '登录已过期，请重新登录。';
  return m;
}
async function api(path, { method = 'GET', body, auth = false, headers = {} } = {}) {
  const h = Object.assign({ apikey: SBKEY, 'Content-Type': 'application/json' }, headers);
  if (auth) { await ensureFresh(); h.Authorization = 'Bearer ' + SES.access_token; }
  const r = await fetch(SB + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) { const er = new Error((j && (j.msg || j.error_description || j.message || j.error)) || ('HTTP ' + r.status)); er.status = r.status; throw er; }
  return j;
}
async function ensureFresh() {
  if (!SES) throw new Error('未登录');
  if (SES.expires_at - 60 > Date.now() / 1000) return;
  try {
    const j = await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: SES.refresh_token } });
    setSes(sesFrom(j, SES));
  } catch (e) {
    if (e.status === 400 || e.status === 401) { setSes(null); renderAcct(); throw new Error('登录已过期，请重新登录。'); }
    throw e;
  }
}
function mergeP(a, b) { const out = Object.assign({}, a); for (const k in b) if (!out[k] || (b[k].t || 0) > (out[k].t || 0)) out[k] = b[k]; return out; }
async function syncNow() {
  if (!CONFIGURED || !SES) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncState = 'busy'; renderAcctStatus();
  try {
    const rows = await api('/rest/v1/progress?select=data&user_id=eq.' + encodeURIComponent(SES.user.id), { auth: true });
    const remote = rows && rows[0] && rows[0].data;
    if (remote && remote.P) {
      const before = JSON.stringify(P);
      P = mergeP(P, remote.P);
      if (JSON.stringify(P) !== before) { save(); stats(); if (S.tab === 'wrong' || S.tab === 'list') render(); }
    }
    await api('/rest/v1/progress?on_conflict=user_id', { method: 'POST', auth: true,
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: { user_id: SES.user.id, data: { v: 1, P }, updated_at: new Date().toISOString() } });
    lastSync = Date.now(); syncState = 'ok'; syncMsg = '';
  } catch (e) { syncState = 'err'; syncMsg = cnErr(e); }
  syncing = false; renderAcct();
  if (syncAgain) { syncAgain = false; syncNow(); }
}
function schedulePush() { if (!CONFIGURED || !SES) return; clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 2500); }
document.addEventListener('visibilitychange', () => {
  if (!SES) return;
  if (document.visibilityState === 'visible') syncNow();
  else if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; syncNow(); }
});
window.addEventListener('online', () => syncNow());

function hhmm(t) { const d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
function renderAcctStatus() {
  const el = document.getElementById('acctStatus'); if (!el) return;
  el.className = 'acct-status ' + syncState;
  el.textContent = syncState === 'busy' ? '正在同步…' : syncState === 'ok' ? `已同步 ${hhmm(lastSync)}` : syncState === 'err' ? syncMsg : '等待同步';
}
function acctMsg(t, bad) { const el = document.getElementById('acctMsg'); if (el) { el.textContent = t; el.className = 'acct-msg' + (bad ? ' bad' : ''); } }
function renderAcct() {
  const el = document.getElementById('acct');
  if (!CONFIGURED) {
    el.innerHTML = `<div class="acct-line"><span class="dot off"></span><span>同步还没配置：按说明把 Supabase 的地址和密钥填进 <code>config.js</code>，这里就会出现登录。现在进度只存在本机。</span></div>`;
    return;
  }
  if (recoveryMode && SES) {
    el.innerHTML = `<form class="acct-form" id="pwForm"><div class="acct-line"><b>设置新密码</b><span class="hint">${esc(SES.user && SES.user.email || '')}</span></div>
      <div class="acct-fields"><input id="newPw" type="password" autocomplete="new-password" placeholder="新密码（至少 6 位）" required minlength="6"><button class="btn primary small" type="submit">保存新密码</button></div>
      <div id="acctMsg" class="acct-msg"></div></form>`;
    return;
  }
  if (SES) {
    el.innerHTML = `<div class="acct-line"><span class="dot on"></span><span class="acct-email">${esc(SES.user && SES.user.email || '已登录')}</span>
      <span id="acctStatus" class="acct-status"></span><span class="acct-act"><button class="btn small" type="button" id="syncBtn">立即同步</button><button class="btn small" type="button" id="logoutBtn">退出登录</button></span></div>`;
    renderAcctStatus(); return;
  }
  el.innerHTML = acctOpen ? `<form class="acct-form" id="loginForm">
      <div class="acct-line"><b>登录同步</b><span class="hint">同一个账号在手机、电脑上登录，进度会自动合并。</span></div>
      <div class="acct-fields">
        <input id="em" type="email" autocomplete="email" placeholder="邮箱" required>
        <input id="pw" type="password" autocomplete="current-password" placeholder="密码（至少 6 位）" minlength="6">
      </div>
      <div class="row"><button class="btn primary small" type="submit" data-act="login">登录</button>
        <button class="btn small" type="button" id="signupBtn">注册新账号</button>
        <button class="btn small" type="button" id="forgotBtn">忘记密码</button>
        <button class="btn small" type="button" id="closeAcct">收起</button></div>
      <div id="acctMsg" class="acct-msg"></div></form>`
    : `<div class="acct-line"><span class="dot off"></span><span>未登录，进度只存在这台设备。</span><span class="acct-act"><button class="btn small primary" type="button" id="openAcct">登录 / 注册，多设备同步</button></span></div>`;
}
async function doLogin(email, pw) {
  acctMsg('正在登录…');
  try { const j = await api('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password: pw } });
    setSes(sesFrom(j)); acctOpen = false; renderAcct(); syncNow();
  } catch (e) { acctMsg(cnErr(e), true); }
}
async function doSignup(email, pw) {
  if (!email || !pw || pw.length < 6) return acctMsg('请填写邮箱和至少 6 位的密码。', true);
  acctMsg('正在注册…');
  try { const j = await api('/auth/v1/signup?redirect_to=' + encodeURIComponent(siteUrl()), { method: 'POST', body: { email, password: pw } });
    if (j && j.access_token) { setSes(sesFrom(j)); acctOpen = false; renderAcct(); syncNow(); }
    else acctMsg(`确认邮件已发到 ${email}。点邮件里的链接后会回到这个网站并自动登录（没收到请看垃圾邮件）。`);
  } catch (e) { acctMsg(cnErr(e), true); }
}
async function doForgot(email) {
  if (!email) return acctMsg('先在上面填好邮箱。', true);
  try { await api('/auth/v1/recover?redirect_to=' + encodeURIComponent(siteUrl()), { method: 'POST', body: { email } });
    acctMsg(`重置密码的邮件已发到 ${email}，点链接回来后可以设置新密码。`);
  } catch (e) { acctMsg(cnErr(e), true); }
}
async function handleAuthHash() {
  if (!CONFIGURED || !location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.get('access_token') && !h.get('error_description')) return;
  history.replaceState(null, '', location.pathname + location.search);
  if (h.get('error_description')) { acctOpen = true; renderAcct(); acctMsg('链接无效或已过期：' + h.get('error_description'), true); return; }
  setSes(sesFrom({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_at: h.get('expires_at'), expires_in: h.get('expires_in') }));
  try { const u = await api('/auth/v1/user', { auth: true }); SES.user = { id: u.id, email: u.email }; setSes(SES); }
  catch (e) { setSes(null); acctOpen = true; renderAcct(); acctMsg(cnErr(e), true); return; }
  recoveryMode = h.get('type') === 'recovery';
  renderAcct(); if (!recoveryMode) syncNow();
}
document.addEventListener('submit', async e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); const em = $('#em').value.trim(), pw = $('#pw').value; if (!pw) return acctMsg('请输入密码。', true); doLogin(em, pw); }
  if (e.target.id === 'pwForm') { e.preventDefault();
    try { await api('/auth/v1/user', { method: 'PUT', auth: true, body: { password: $('#newPw').value } }); recoveryMode = false; renderAcct(); syncNow(); }
    catch (er) { acctMsg(cnErr(er), true); } }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'openAcct') { acctOpen = true; renderAcct(); const m = $('#em'); if (m) m.focus(); }
  else if (t.id === 'closeAcct') { acctOpen = false; renderAcct(); }
  else if (t.id === 'signupBtn') doSignup($('#em').value.trim(), $('#pw').value);
  else if (t.id === 'forgotBtn') doForgot($('#em').value.trim());
  else if (t.id === 'syncBtn') syncNow();
  else if (t.id === 'logoutBtn') { setSes(null); syncState = 'idle'; renderAcct(); }
});

load();
if (!Array.isArray(S.days) || !S.days.length) S.days = [13];
renderDays(); stats(); render();
renderAcct(); handleAuthHash(); syncNow();
</script>
